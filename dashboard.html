<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回答状況</title>
    
    <link rel="icon" href="./favicon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="./logo-color-2.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #1e3656;
            --secondary-color: #5dade2;
            --light-gray: #f8f9fa;
            --medium-gray: #dee2e6;
            --border-radius: 8px;
        }
        body {
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6; color: #333; max-width: 800px;
            margin: 20px auto; padding: 0 20px; background-color: #f4f7f9;
        }
        .container {
            background-color: #fff; padding: 30px; border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 5px solid var(--secondary-color);
        }
        h1 {
            color: var(--primary-color); text-align: center; font-weight: 700;
            font-size: 1.8em; margin-top: 0; margin-bottom: 30px;
        }
        .overview-panel {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--medium-gray);
            padding-bottom: 20px;
        }
        .overview-item {
            font-size: 1.1em;
            color: var(--primary-color);
            padding: 5px 0;
        }
        .overview-item span {
            font-weight: 700;
            font-size: 1.4em;
            color: #333;
            margin-left: 10px;
        }
        .overview-item .unit {
            font-size: 0.9em;
            margin-left: 4px;
        }
        .section {
            padding-top: 15px;
        }
        .section-title {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        .list-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }
        .list-table th, .list-table td {
            border: 1px solid var(--medium-gray);
            padding: 12px;
            text-align: left;
            vertical-align: middle;
        }
        .list-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: var(--primary-color);
        }
        .name-cell {
            width: auto;
        }
        .btn-cell {
            width: 1%;
            white-space: nowrap;
            text-align: center;
        }
        .btn-confirm {
            background-color: var(--primary-color);
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn-confirm:hover {
            opacity: 0.8;
        }
        .hidden { display: none !important; }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .loading-logo { max-width: 150px; margin-bottom: 20px; }
        #loading p { color: var(--primary-color); font-size: 1.2em; margin-top: 20px; font-weight: 700; }
        .dots-loader { display: flex; justify-content: center; align-items: center; height: 40px; }
        .dots-loader div { width: 15px; height: 15px; background-color: var(--primary-color); border-radius: 50%; margin: 0 5px; animation: bounce 1.4s infinite ease-in-out both; }
        .dots-loader .dot1 { animation-delay: -0.32s; } .dots-loader .dot2 { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        
        @media (max-width: 600px) {
            body { padding: 0 10px; }
            h1 { font-size: 1.6em; }
            .container { padding: 20px; }

            .overview-item {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
            }
            .overview-item span {
                margin-left: 0;
                font-size: 1.2em;
            }

            .list-table thead {
                display: none;
            }
            .list-table, .list-table tbody {
                display: block;
                width: 100%;
            }
            .list-table tr {
                display: block;
                border: 1px solid var(--medium-gray);
                border-radius: var(--border-radius);
                margin-bottom: 15px;
                padding: 10px;
            }
            .list-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: none;
                border-bottom: 1px solid #f0f0f0;
                padding: 10px 5px;
            }
            .list-table td:last-child {
                border-bottom: none;
            }
            .list-table td::before {
                content: attr(data-label);
                font-weight: bold;
                color: var(--primary-color);
                text-align: left;
                margin-right: 10px;
                flex-shrink: 0;
            }
            .list-table .name-cell span {
                word-break: break-all;
                text-align: right;
            }

            .btn-cell {
                justify-content: center;
                padding-top: 15px;
            }
            .btn-cell::before {
                display: none;
            }
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            position: relative;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dropdown-btn:hover {
            background-color: #3a5a8a;
        }
        .dropdown-btn::after {
            content: '▼';
            font-size: 0.7em;
            transform: translateY(1px);
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 260px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: var(--border-radius);
            overflow: hidden;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            white-space: nowrap;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown-content a.disabled {
            color: #999;
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
        .dropdown.show .dropdown-content {
            display: block;
        }
        .dropdown.show .dropdown-btn::after {
            content: '▲';
        }
        
        /* ▼▼▼ プログレスバー用CSS (パターンB: Bright Blue) ▼▼▼ */
        .progress-container {
            background-color: #e9ecef;
            border-radius: 6px;
            height: 30px;
            width: 80%;
            max-width: 400px;
            margin: 15px auto;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #5dade2; /* Bright Blue */
            transition: width 0.3s ease;
            
            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.2) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0.2) 75%,
                transparent 75%,
                transparent
            );
            background-size: 40px 40px;
            animation: progress-stripe 1s linear infinite;
        }

        @keyframes progress-stripe {
            0% { background-position: 40px 0; }
            100% { background-position: 0 0; }
        }
    
        /* ▼▼▼ タブ（回答送信／追加確認） ▼▼▼ */
        .tab-bar {
            display: flex; gap: 8px; margin-top: 25px;
            border-bottom: 2px solid var(--medium-gray);
        }
        .tab-btn {
            background: none; border: none; cursor: pointer; font-family: inherit;
            font-size: 1em; font-weight: 700; color: #6c757d;
            padding: 10px 18px; margin-bottom: -2px;
            border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0;
            transition: color 0.2s, border-color 0.2s, background-color 0.2s;
        }
        .tab-btn:hover { color: var(--primary-color); background-color: var(--light-gray); }
        .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--secondary-color); }
        .tab-count {
            display: inline-block; min-width: 22px; padding: 1px 7px; margin-left: 6px;
            border-radius: 11px; font-size: 0.8em; background-color: var(--medium-gray); color: var(--primary-color);
        }
        .tab-btn.active .tab-count { background-color: var(--secondary-color); color: #fff; }
        .dropdown-label {
            padding: 8px 16px 4px 16px; font-size: 0.75em; font-weight: 700; color: #6c757d;
            background-color: var(--light-gray); cursor: default;
        }
        .dropdown-group + .dropdown-group { border-top: 1px solid var(--medium-gray); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .tab-note { font-size: 0.85em; color: #555; margin: 0 0 12px 0; }
        .old-tag {
            display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 0.75em;
            color: #6c757d; border: 1px solid var(--medium-gray); border-radius: 4px; vertical-align: middle;
        }
        @media (max-width: 600px) {
            .tab-btn { flex: 1; padding: 10px 8px; font-size: 0.95em; }
        }
</style>
</head>
<body>
    <div id="loading" class="hidden">
        <img src="./favicon.jpg" alt="Logo" class="loading-logo">
        
        <div id="default-loader" class="dots-loader">
            <div class="dot1"></div> <div class="dot2"></div> <div class="dot3"></div>
        </div>
        
        <div id="progress-wrapper" class="hidden" style="width: 100%; text-align: center;">
            <div class="progress-container">
                <div id="download-progress-bar" class="progress-bar"></div>
            </div>
        </div>

        <p id="loading-text">データを読み込んでいます...</p>
    </div>

    <div class="container">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="./logo-color-2.jpg" alt="スタートアップ税理士法人 Logo" style="max-width: 180px;">
        </div>
        <h1>回答状況</h1>
        
        <div class="header-actions">
            <div class="dropdown hidden" id="download-dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown(event)">ダウンロード</button>
                <div class="dropdown-content">
                    <div class="dropdown-group" id="download-main-group">
                        <div class="dropdown-label">回答送信</div>
                        <a href="#" id="download-csv-btn">一覧をCSVでダウンロード</a>
                        <a href="#" id="download-zip-btn">添付ファイルを一括ダウンロード</a>
                        <a href="#" id="download-pdf-btn">回答PDFをまとめてダウンロード</a>
                    </div>
                    <div class="dropdown-group" id="download-additional-group">
                        <div class="dropdown-label">追加確認</div>
                        <a href="#" id="download-additional-csv-btn">一覧をCSVでダウンロード</a>
                        <a href="#" id="download-additional-pdf-btn">回答PDFをまとめてダウンロード</a>
                    </div>
                </div>
            </div>
        </div>
        <div id="dashboard-content">
        </div>
    </div>

    <script>
        // ★★★ 令和8年用の新しいGAS WebアプリURLに書き換えてください ★★★
        const GAS_WEB_APP_URL = 'https://script.google.com/a/macros/tax-startup.com/s/AKfycbxSIgc5YqpXhgy-7D26FI-A9iv5ZdOE6WyU0JYvMIkHbXwr9CJ_gfmzEx8smxoi9hFKyw/exec';
        const MY_SECRET_KEY = "StartupTax-Secret-Key-vB9^YWLiVoSW6y5"; 

        let dashboardData = null;
        let currentCompanyName = null;
        let dashboardKey = ''; // 【追加】確認画面キー（?key=... のURLの場合のみ値が入る）
        let currentClientId = ''; // 【セキュリティ修正A】事業者ID（?id=... のURLの場合のみ値が入る）

        function toggleDropdown(event) {
            event.stopPropagation();
            document.getElementById('download-dropdown').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }

        function downloadCSV() {
            if (!dashboardData || !dashboardData.employees || dashboardData.employees.length === 0) {
                alert('ダウンロードするデータがありません。');
                return;
            }

            // 修正要件2 対象箇所1： '年末調整実施可否' → '年末調整実施確認'
            const headers = ['氏名', '年末調整実施確認', '住民税の徴収方法'];
            const rows = dashboardData.employees.map(emp => {
                return [
                    `"${(emp.name || '').replace(/"/g, '""')}"`,
                    `"${(emp.adjustment || '').replace(/"/g, '""')}"`,
                    `"${(emp.residentTax || '').replace(/"/g, '""')}"`
                ].join(',');
            });

            const csvContent = [headers.join(','), ...rows].join('\n');
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            const safeCompanyName = (dashboardData.clientName || '不明な事業者').replace(/[\\/:"*?<>|]/g, '_');
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            link.setAttribute("download", `${safeCompanyName}_回答状況_${today}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function processClientSideDownload(zipFileName, actionType) {
            if (!currentCompanyName) {
                alert('事業者名が取得できていません。');
                return;
            }

            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loading-text');
            const progressWrapper = document.getElementById('progress-wrapper');
            const progressBar = document.getElementById('download-progress-bar');
            const defaultLoader = document.getElementById('default-loader');

            loading.classList.remove('hidden');
            progressWrapper.classList.remove('hidden');
            defaultLoader.classList.add('hidden');
            progressBar.style.width = '0%';
            loadingText.textContent = 'ダウンロードリストを取得中...';

            try {
                const listResponse = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: actionType,
                        clientId: currentClientId, // 【セキュリティ修正A】事業者名ではなくID／キーで問い合わせる
                        dashboardKey: dashboardKey,
                        secret: MY_SECRET_KEY
                    })
                });
                const listResult = await listResponse.json();
                
                if (listResult.result !== 'success') throw new Error(listResult.message);
                
                const files = listResult.files;
                if (files.length === 0) {
                    alert('ダウンロード対象のファイルがありませんでした。');
                    return; 
                }

                const zip = new JSZip();
                const total = files.length;
                let count = 0;

                for (const file of files) {
                    count++;
                    const percentage = Math.round((count / total) * 100);
                    progressBar.style.width = percentage + '%';
                    loadingText.textContent = `${count} / ${total} ファイル (${percentage}%) を処理中...`;
                    
                    try {
                        const contentResponse = await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'getFileContent',
                                fileId: file.id,
                                clientId: currentClientId, // 【セキュリティ修正A】
                                dashboardKey: dashboardKey,
                                secret: MY_SECRET_KEY
                            })
                        });
                        const contentResult = await contentResponse.json();
                        
                        if (contentResult.result === 'success') {
                            zip.file(file.name, contentResult.data, {base64: true});
                        } else {
                            console.error(`Skipped ${file.name}: ${contentResult.message}`);
                            zip.file(`エラー_${file.name}.txt`, `ダウンロード失敗: ${contentResult.message}`);
                        }
                    } catch (e) {
                        console.error(`Error downloading ${file.name}`, e);
                    }
                }

                loadingText.textContent = 'ZIPファイルを生成中...';
                const content = await zip.generateAsync({type: "blob"});
                saveAs(content, zipFileName);
                alert('ダウンロードが完了しました。');

            } catch (e) {
                alert(`エラーが発生しました: ${e.message}`);
            } finally {
                loading.classList.add('hidden');
                progressWrapper.classList.add('hidden');
                defaultLoader.classList.remove('hidden');
                loadingText.textContent = 'データを読み込んでいます...';
            }
        }

        function downloadFilesZip() {
            if (this.classList && this.classList.contains('disabled')) return;
            const fileName = `${currentCompanyName}_添付ファイル一括.zip`;
            processClientSideDownload(fileName, 'getZipFileList');
        }
        
        function downloadPdfs() {
            if (this.classList && this.classList.contains('disabled')) return;
            const fileName = `${currentCompanyName}_回答PDF一括.zip`;
            generateClientSidePdfs(fileName);
        }

        async function generateClientSidePdfs(zipFileName) {
            if (!currentCompanyName) {
                alert('事業者名が取得できていません。');
                return;
            }

            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loading-text');
            const progressWrapper = document.getElementById('progress-wrapper');
            const progressBar = document.getElementById('download-progress-bar');
            const defaultLoader = document.getElementById('default-loader');
            
            loading.classList.remove('hidden');
            progressWrapper.classList.remove('hidden');
            defaultLoader.classList.add('hidden');
            progressBar.style.width = '0%';
            loadingText.textContent = '回答データを取得中...';

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getAllEmployeeData',
                        clientId: currentClientId, // 【セキュリティ修正A】事業者名ではなくID／キーで問い合わせる
                        dashboardKey: dashboardKey,
                        secret: MY_SECRET_KEY
                    })
                });
                const result = await response.json();
                if (result.result !== 'success') throw new Error(result.message);
                
                const employees = result.employees;
                if (employees.length === 0) {
                    alert('データがありません。');
                    return;
                }

                const allKeys = Object.keys(employees[0]);
                const ignoreKeys = ['タイムスタンプ', '回答表示URL', '最終更新日時', '事業者名', 'メールアドレス'];

                const zip = new JSZip();
                const total = employees.length;
                let count = 0;
                
                const pdfContent = document.getElementById('pdf-content');

                for (const emp of employees) {
                    count++;
                    const percentage = Math.round((count / total) * 100);
                    progressBar.style.width = percentage + '%';
                    loadingText.textContent = `${count} / ${total} 名のPDFを作成中... (${percentage}%)`;

                    document.getElementById('pdf-header-company').textContent = currentCompanyName;
                    document.getElementById('pdf-header-name').textContent = `${emp['姓']} ${emp['名']}`;
                    // フリガナ欄を「回答ID」に変更
                    document.getElementById('pdf-header-id').textContent = emp['回答ID'] || '';

                    const table = document.getElementById('pdf-details-table');
                    table.innerHTML = '';
                    
                    allKeys.forEach(key => {
                        if (ignoreKeys.includes(key)) return;
                        if (key.endsWith('URL')) return;
                        // 回答IDはヘッダーに出すので、表からは除外しても良いですが、念のため残す設定にしています

                        let value = emp[key];
                        if (value === '' || value === null || value === undefined) {
                            value = ' '; 
                        }
                        if (typeof value === 'string') {
                            if (key.endsWith('FileName')) {
                                value = value.replace(/\n/g, '<br>');
                            }
                        }
                        if (key.includes('金額') && value && !isNaN(Number(String(value).replace(/,/g, '')))) {
                             value = Number(String(value).replace(/,/g, '')).toLocaleString('ja-JP') + ' 円';
                        }
                        if (key.includes('_住所同じ')) {
                            value = (String(value).toUpperCase() === 'TRUE' || value === true) ? '該当' : '';
                        }
                        
                        const tr = document.createElement('tr');
                        tr.style.border = "1px solid #333";

                        const th = document.createElement('th');
                        th.style.cssText = "width: 40%; background-color: #f5f5f5; border: 1px solid #333; padding: 4px 8px; text-align: left; font-weight: normal; word-break: break-all;";
                        th.textContent = key.replace('FileName', ' (添付書類)');

                        const td = document.createElement('td');
                        td.style.cssText = "width: 60%; border: 1px solid #333; padding: 4px 8px; word-break: break-all;";
                        td.innerHTML = value;

                        tr.appendChild(th);
                        tr.appendChild(td);
                        table.appendChild(tr);
                    });

                    const opt = {
                        margin:       10,
                        filename:     'doc.pdf',
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true }, 
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
                    };

                    const pdfBlob = await html2pdf().set(opt).from(pdfContent).output('blob');
                    const safeName = `${emp['姓']}_${emp['名']}`.replace(/[\\/:"*?<>|]/g, '_');
                    zip.file(`${safeName}_回答内容.pdf`, pdfBlob);

                    await new Promise(resolve => setTimeout(resolve, 20));
                }

                loadingText.textContent = 'ZIPファイルを圧縮中...';
                const content = await zip.generateAsync({type: "blob"});
                saveAs(content, zipFileName);
                alert('PDFの一括ダウンロードが完了しました。');

            } catch (e) {
                console.error(e);
                alert(`エラー: ${e.message}`);
            } finally {
                loading.classList.add('hidden');
                progressWrapper.classList.add('hidden');
                defaultLoader.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('download-csv-btn').addEventListener('click', function(e) {
                e.preventDefault();
                if (this.classList.contains('disabled')) return;
                downloadCSV();
                toggleDropdown(new Event('click'));
            });

            document.getElementById('download-zip-btn').addEventListener('click', function(e) {
                e.preventDefault();
                if (this.classList.contains('disabled')) return;
                downloadFilesZip();
                toggleDropdown(new Event('click'));
            });
            
            document.getElementById('download-pdf-btn').addEventListener('click', function(e) {
                e.preventDefault();
                if (this.classList.contains('disabled')) return;
                downloadPdfs();
                toggleDropdown(new Event('click'));
            });

            document.getElementById('download-additional-csv-btn').addEventListener('click', function(e) {
                e.preventDefault();
                downloadAdditionalCSV();
                toggleDropdown(new Event('click'));
            });

            document.getElementById('download-additional-pdf-btn').addEventListener('click', function(e) {
                e.preventDefault();
                downloadAdditionalPdfs();
                toggleDropdown(new Event('click'));
            });

            loadDashboardData();
        });

        async function loadDashboardData() {
            const container = document.getElementById('dashboard-content');
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');

            try {
                // 修正要件1 【ハイブリッドURLへの対応とAPI通信の追加】
                const params = new URLSearchParams(window.location.search);
                const rawId = params.get('id'); // 'company' から 'id' に変更
                dashboardKey = (params.get('key') || '').trim(); // 【追加】確認画面キー
                
                if (!rawId && !dashboardKey) {
                    throw new Error("対象の事業者IDが指定されていません。");
                }

                let nameResponse;
                if (dashboardKey) {
                    // 【追加】キー付きURL（?key=...）の場合：キーから事業者名を取得
                    nameResponse = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'getClientNameByDashboardKey',
                            dashboardKey: dashboardKey,
                            secret: MY_SECRET_KEY
                        })
                    });
                } else {
                    // 従来のURL（?id=...）の場合：アンダーバーで分割し、前半のID部分を抽出
                    const clientId = rawId.split('_')[0];
                    currentClientId = clientId; // 【セキュリティ修正A】
                    
                    // GASに対してPOSTリクエストを送信し、事業者名を取得
                    nameResponse = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'getClientNameById',
                            clientId: clientId,
                            secret: MY_SECRET_KEY
                        })
                    });
                }

                const nameResult = await nameResponse.json();
                
                if (nameResult.result !== 'success') {
                    throw new Error(dashboardKey ? nameResult.message : `事業者名の取得に失敗しました: ${nameResult.message}`);
                }

                currentCompanyName = nameResult.clientName;

                // 【セキュリティ修正A】事業者ID（またはキー）を用いてPOSTでデータを取得（URLに秘密鍵・IDを載せない）
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'getClientDashboardData',
                        clientId: currentClientId,
                        dashboardKey: dashboardKey,
                        secret: MY_SECRET_KEY
                    })
                });
                const result = await response.json();

                if (result.result !== 'success') {
                    throw new Error(result.message);
                }

                const data = result.data;
                dashboardData = data; 
                const additionalList = Array.isArray(data.additional) ? data.additional : [];
                
                let contentHtml = `
                    <div class="overview-panel">
                        <div class="overview-item">
                            事業者名
                            <span>${escapeHtml(data.clientName)}</span>
                        </div>
                        <div class="overview-item">
                            回答済み従業員
                            <span>${data.employeeCount}<span class="unit">名</span></span>
                        </div>
                        <div class="overview-item">
                            追加確認の回答
                            <span>${additionalList.length}<span class="unit">件</span></span>
                        </div>
                    </div>

                    <div class="tab-bar" role="tablist">
                        <button type="button" class="tab-btn active" data-tab="main" role="tab">回答送信<span class="tab-count">${data.employeeCount}</span></button>
                        <button type="button" class="tab-btn" data-tab="additional" role="tab">追加確認<span class="tab-count">${additionalList.length}</span></button>
                    </div>
                `;

                // ▼ タブ1：回答送信（既存の一覧）
                contentHtml += `
                    <div class="tab-panel active" id="tab-main">
                    <div class="section">
                        <div class="section-title">回答状況一覧</div>
                `;

                // ダウンロードメニューは、回答送信・追加確認のどちらかにデータがあれば表示
                document.getElementById('download-main-group').classList.toggle('hidden', data.employeeCount === 0);
                document.getElementById('download-additional-group').classList.toggle('hidden', additionalList.length === 0);
                if (data.employeeCount > 0 || additionalList.length > 0) {
                    document.getElementById('download-dropdown').classList.remove('hidden');
                }

                if (data.employeeCount > 0) {

                    contentHtml += `
                        <table id="employee-list-table" class="list-table">
                            <thead>
                                <tr>
                                    <th class="name-cell">氏名</th>
                                    <th>年末調整実施確認</th> <!-- 修正要件2 対象箇所2 -->
                                    <th>住民税の徴収方法</th>
                                    <th class="btn-cell"></th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    data.employees.forEach(employee => {
                        contentHtml += `
                            <tr>
                                <td class="name-cell" data-label="氏名"><span>${escapeHtml(employee.name)}</span></td>
                                <td data-label="年末調整実施確認">${escapeHtml(employee.adjustment)}</td> <!-- 修正要件2 対象箇所3 -->
                                <td data-label="住民税の徴収方法">${escapeHtml(employee.residentTax)}</td>
                                <td class="btn-cell">
                                    <a href="${employee.viewUrl}" target="_blank" rel="noopener noreferrer" class="btn-confirm">
                                        回答確認
                                    </a>
                                </td>
                            </tr>
                        `;
                    });
                    contentHtml += `</tbody></table>`;
                } else {
                    contentHtml += '<p style="text-align:center; padding: 20px 0;">まだ回答済みの従業員はいません。</p>';
                }
                
                contentHtml += `</div></div>`;

                // ▼ タブ2：追加確認
                contentHtml += buildAdditionalPanel(additionalList);
                
                container.innerHTML = contentHtml;
                setupTabs();

            } catch (error) {
                container.innerHTML = `<p style="color: red; text-align: center;">データの読み込みに失敗しました: ${error.message}</p>`;
            } finally {
                loading.classList.add('hidden');
            }
        }
        
        // ===== 追加確認のダウンロード =====
        const ADDITIONAL_ITEM_CHILD = '23歳未満の扶養親族';
        const ADDITIONAL_ITEM_INCOME = 'その他収入の所得金額';

        // 追加確認シートの全行を取得（1対象者1行）
        async function fetchAdditionalRows() {
            const response = await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getAllAdditionalData', clientId: currentClientId, dashboardKey: dashboardKey, secret: MY_SECRET_KEY }) // 【セキュリティ修正A】
            });
            const result = await response.json();
            if (result.result !== 'success') throw new Error(result.message);
            return result.rows || [];
        }

        const safeFileName = (str) => String(str || '').replace(/[\\/:"*?<>|]/g, '_');
        const todayStr = () => new Date().toISOString().slice(0, 10).replace(/-/g, '');
        const isBlankVal = (v) => v === '' || v === null || v === undefined;
        const yenText = (v) => isBlankVal(v) ? '' : Number(String(v).replace(/,/g, '')).toLocaleString('ja-JP') + ' 円';

        async function downloadAdditionalCSV() {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loading-text');
            loading.classList.remove('hidden');
            loadingText.textContent = '追加確認のデータを取得中...';
            try {
                const rows = await fetchAdditionalRows();
                if (rows.length === 0) {
                    alert('ダウンロードするデータがありません。');
                    return;
                }
                const columns = [
                    ['回答日時', 'タイムスタンプ'], ['回答ID', '回答ID'], ['本人姓', '本人姓'], ['本人名', '本人名'],
                    ['メールアドレス', 'メールアドレス'], ['確認項目', '確認項目'], ['No', 'No'],
                    ['対象者氏名', '対象者氏名'], ['対象者フリガナ', '対象者フリガナ'], ['続柄・対象者区分', '続柄・対象者区分'],
                    ['生年月日', '生年月日'], ['令和8年中の所得見積金額', '令和8年中の所得見積金額'],
                    ['退職所得金額', '退職所得金額'], ['事業所得金額', '事業所得金額'], ['その他所得金額', 'その他所得金額'],
                    ['備考', '備考'], ['確認画面URL', '確認画面URL']
                ];
                const q = (v) => `"${String(isBlankVal(v) ? '' : v).replace(/"/g, '""')}"`;
                const lines = [columns.map(c => q(c[0])).join(',')];
                rows.forEach(r => lines.push(columns.map(c => q(r[c[1]])).join(',')));

                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
                saveAs(blob, `${safeFileName(dashboardData.clientName || currentCompanyName)}_追加確認一覧_${todayStr()}.csv`);
            } catch (e) {
                alert(`エラーが発生しました: ${e.message}`);
            } finally {
                loading.classList.add('hidden');
                loadingText.textContent = 'データを読み込んでいます...';
            }
        }

        // 送信（回答ID）ごとに1つのPDFを作成し、ZIPにまとめる
        async function downloadAdditionalPdfs() {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loading-text');
            const progressWrapper = document.getElementById('progress-wrapper');
            const progressBar = document.getElementById('download-progress-bar');
            const defaultLoader = document.getElementById('default-loader');
            const titleEl = document.getElementById('pdf-title');
            const subtitleEl = document.getElementById('pdf-subtitle');
            const originalTitle = titleEl.textContent;
            const originalSubtitle = subtitleEl.textContent;
            // PDFテンプレートの寸法を一時的に調整する（終了後に元へ戻す）
            //  ・最小高さ（A4 1枚分）を外し、余白込みで1ページを超えて押し出されないようにする
            //  ・幅をA4の印刷範囲（210mm − 左右余白10mm×2）に収め、右端が切れないようにする
            const pdfBox = document.getElementById('pdf-content');
            const originalBoxStyle = { minHeight: pdfBox.style.minHeight, width: pdfBox.style.width, padding: pdfBox.style.padding };

            loading.classList.remove('hidden');
            progressWrapper.classList.remove('hidden');
            defaultLoader.classList.add('hidden');
            progressBar.style.width = '0%';
            loadingText.textContent = '追加確認のデータを取得中...';

            try {
                const rows = await fetchAdditionalRows();
                if (rows.length === 0) {
                    alert('データがありません。');
                    return;
                }

                // 回答IDごとにまとめる（並び順はシートの順＝送信順）
                const groups = [];
                const map = {};
                rows.forEach(r => {
                    const id = r['回答ID'];
                    if (!map[id]) { map[id] = []; groups.push(map[id]); }
                    map[id].push(r);
                });

                titleEl.textContent = '年末調整 追加確認 回答内容';
                subtitleEl.textContent = '回答内容';
                pdfBox.style.minHeight = '0';
                pdfBox.style.width = '190mm';
                pdfBox.style.padding = '6mm 8mm';

                const zip = new JSZip();
                const usedNames = {};
                const pdfContent = document.getElementById('pdf-content');
                const table = document.getElementById('pdf-details-table');

                const addTr = (label, value) => {
                    const tr = document.createElement('tr');
                    const th = document.createElement('th');
                    th.style.cssText = "width: 40%; background-color: #f5f5f5; border: 1px solid #333; padding: 3px 8px; text-align: left; font-weight: normal; word-break: break-all;";
                    th.textContent = label;
                    const td = document.createElement('td');
                    td.style.cssText = "width: 60%; border: 1px solid #333; padding: 3px 8px; word-break: break-all; white-space: pre-wrap;";
                    td.textContent = isBlankVal(value) ? ' ' : value;
                    tr.appendChild(th);
                    tr.appendChild(td);
                    table.appendChild(tr);
                };
                const addHeadTr = (text) => {
                    const tr = document.createElement('tr');
                    const th = document.createElement('th');
                    th.colSpan = 2;
                    th.style.cssText = "background-color: #ddd; border: 1px solid #333; padding: 3px 8px; text-align: left; font-weight: bold;";
                    th.textContent = text;
                    tr.appendChild(th);
                    table.appendChild(tr);
                };

                for (let i = 0; i < groups.length; i++) {
                    const g = groups[i];
                    const first = g[0];
                    const percentage = Math.round(((i + 1) / groups.length) * 100);
                    progressBar.style.width = percentage + '%';
                    loadingText.textContent = `${i + 1} / ${groups.length} 件のPDFを作成中... (${percentage}%)`;

                    const name = `${first['本人姓'] || ''} ${first['本人名'] || ''}`.trim();
                    document.getElementById('pdf-header-company').textContent = currentCompanyName;
                    document.getElementById('pdf-header-name').textContent = name;
                    document.getElementById('pdf-header-id').textContent = first['回答ID'] || '';

                    table.innerHTML = '';
                    addTr('回答日時', first['タイムスタンプ']);
                    addTr('メールアドレス', first['メールアドレス']);

                    const children = g.filter(r => r['確認項目'] === ADDITIONAL_ITEM_CHILD);
                    const incomes = g.filter(r => r['確認項目'] === ADDITIONAL_ITEM_INCOME);

                    addHeadTr('23歳未満の扶養親族');
                    if (children.length === 0) addTr('回答', '該当なし');
                    children.forEach(c => {
                        addHeadTr(`扶養親族 ${c['No']}`);
                        addTr('氏名', c['対象者氏名']);
                        addTr('フリガナ', c['対象者フリガナ']);
                        addTr('続柄', c['続柄・対象者区分']);
                        addTr('生年月日', c['生年月日']);
                        addTr('令和8年中の所得見積金額', yenText(c['令和8年中の所得見積金額']));
                        addTr('備考', c['備考']);
                    });

                    addHeadTr('その他収入の所得金額');
                    if (incomes.length === 0) addTr('回答', '該当なし');
                    incomes.forEach(r => {
                        addHeadTr(`対象者 ${r['No']}`);
                        const type = r['続柄・対象者区分'];
                        addTr('対象者', type === 'ご本人' ? 'ご本人' : `${type}（${r['対象者氏名'] || ''}）`);
                        ['退職所得金額', '事業所得金額', 'その他所得金額'].forEach(k => {
                            if (!isBlankVal(r[k])) addTr(k, yenText(r[k]));
                        });
                        addTr('備考', r['備考']);
                    });

                    const opt = {
                        margin: 10, filename: 'doc.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        // 表全体ではなく行単位で改ページを避ける（内容が長い場合は行の切れ目で次ページへ）
                        pagebreak: { mode: ['css', 'legacy'], avoid: 'tr' }
                    };
                    const pdfBlob = await html2pdf().set(opt).from(pdfContent).output('blob');

                    // 同じ方が複数回送信している場合はファイル名に連番を付ける
                    let base = `${safeFileName(name.replace(' ', '_'))}_追加確認`;
                    usedNames[base] = (usedNames[base] || 0) + 1;
                    if (usedNames[base] > 1) base += `_${usedNames[base]}`;
                    zip.file(`${base}.pdf`, pdfBlob);

                    await new Promise(resolve => setTimeout(resolve, 20));
                }

                loadingText.textContent = 'ZIPファイルを圧縮中...';
                const content = await zip.generateAsync({ type: 'blob' });
                saveAs(content, `${safeFileName(currentCompanyName)}_追加確認PDF一括.zip`);
                alert('PDFの一括ダウンロードが完了しました。');
            } catch (e) {
                console.error(e);
                alert(`エラー: ${e.message}`);
            } finally {
                titleEl.textContent = originalTitle;
                subtitleEl.textContent = originalSubtitle;
                pdfBox.style.minHeight = originalBoxStyle.minHeight;
                pdfBox.style.width = originalBoxStyle.width;
                pdfBox.style.padding = originalBoxStyle.padding;
                loading.classList.add('hidden');
                progressWrapper.classList.add('hidden');
                defaultLoader.classList.remove('hidden');
                loadingText.textContent = 'データを読み込んでいます...';
            }
        }

        // 追加確認タブの中身（送信1件につき1行、新しい順）
        function buildAdditionalPanel(list) {
            let html = `
                <div class="tab-panel" id="tab-additional">
                <div class="section">
                    <div class="section-title">追加確認 回答一覧</div>
            `;
            if (list.length === 0) {
                html += '<p style="text-align:center; padding: 20px 0;">まだ追加確認の回答はありません。</p>';
                return html + '</div></div>';
            }

            html += '<p class="tab-note">※同じ方が複数回送信している場合、以前の回答には「以前の回答」と表示しています。最新の回答をご確認ください。</p>';
            html += `
                <table id="additional-list-table" class="list-table">
                    <thead>
                        <tr>
                            <th class="name-cell">氏名</th>
                            <th>23歳未満の扶養親族</th>
                            <th>その他収入の所得金額</th>
                            <th class="btn-cell"></th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            const seen = new Set(); // 新しい順に並んでいるので、2回目以降に出てきた氏名は以前の回答
            list.forEach(item => {
                const isOld = seen.has(item.name);
                seen.add(item.name);
                const count = (n) => n > 0 ? `${n}名` : '該当なし';
                html += `
                    <tr>
                        <td class="name-cell" data-label="氏名"><span>${escapeHtml(item.name)}${isOld ? '<span class="old-tag">以前の回答</span>' : ''}</span></td>
                        <td data-label="23歳未満の扶養親族">${count(item.childCount)}</td>
                        <td data-label="その他収入の所得金額">${count(item.incomeCount)}</td>
                        <td class="btn-cell">
                            <a href="${escapeHtml(item.viewUrl)}" target="_blank" rel="noopener noreferrer" class="btn-confirm">回答確認</a>
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table></div></div>';
            return html;
        }

        // タブの切り替え（#additional で開くと追加確認タブを表示）
        function setupTabs() {
            const buttons = document.querySelectorAll('.tab-btn');
            const show = (name) => {
                buttons.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${name}`));
            };
            buttons.forEach(b => b.addEventListener('click', () => {
                show(b.dataset.tab);
                history.replaceState(null, '', b.dataset.tab === 'additional' ? '#additional' : location.pathname + location.search);
            }));
            if (location.hash === '#additional') show('additional');
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>"']/g, function(match) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[match];
            });
        }
    </script>
    
    <div id="pdf-template-container" style="position: fixed; left: -9999px; top: 0;">
        <div id="pdf-content" style="width: 190mm; padding: 10mm; background: white; box-sizing: border-box; font-family: 'HeiseiMinchoStd-W3', 'Ryumin', serif; color: #333; line-height: 1.5;">
            
            <div style="text-align: center; border-bottom: 2px solid #333; margin-bottom: 25px; padding-bottom: 10px;">
                <h1 id="pdf-title" style="margin: 0; font-size: 22px; font-weight: bold;">年末調整 提出情報</h1>
            </div>

            <div style="margin-bottom: 20px;">
                <table style="width: 100%; font-size: 12px; border-collapse: collapse; border: 1px solid #333;">
                    <tr>
                        <td style="width: 15%; font-weight: bold; background-color: #f5f5f5; border: 1px solid #333; padding: 6px;">事業者名</td>
                        <td colspan="3" style="border: 1px solid #333; padding: 6px;" id="pdf-header-company"></td>
                    </tr>
                    <tr>
                        <td style="width: 15%; font-weight: bold; background-color: #f5f5f5; border: 1px solid #333; padding: 6px;">氏名</td>
                        <td style="width: 35%; border: 1px solid #333; padding: 6px;" id="pdf-header-name"></td>
                        <td style="width: 15%; font-weight: bold; background-color: #f5f5f5; border: 1px solid #333; padding: 6px;">回答ID</td>
                        <td style="width: 35%; border: 1px solid #333; padding: 6px;" id="pdf-header-id"></td>
                    </tr>

            <div>
                <h3 id="pdf-subtitle" style="font-size: 14px; background-color: #eee; padding: 5px 10px; margin-bottom: 0; border-top: 1px solid #333; border-left: 1px solid #333; border-right: 1px solid #333;">回答内容</h3>
                <table id="pdf-details-table" style="width: 95%; margin: 0 auto; border-collapse: collapse; font-size: 10px;">
                </table>
            </div>
            
        </div>
    </div>
</body>
